<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globo Terráqueo 3D Centrado</title>
    <style>
        /* Reset básico para eliminar márgenes y padding por defecto */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* Estilos para el cuerpo de la página */
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Elimina las barras de desplazamiento */
            font-family: Arial, sans-serif;
        }
        
        /* Contenedor principal que ocupa toda la pantalla */
        #main-container {
            width: 100%;
            height: 100vh; /* Ocupa toda la altura visible */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a2a6c, #2a4b8c);
        }
        
        /* Contenedor del globo que se ajusta automáticamente */
        #globeContainer {
            width: 90vw; /* 90% del ancho de viewport */
            height: 80vh; /* 80% de la altura de viewport */
            max-width: 1000px;
            max-height: 800px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        /* Mensaje de carga o información */
        #status {
            color: white;
            margin-top: 15px;
            text-align: center;
            padding: 0 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="main-container">
        <div id="globeContainer"></div>
        <div id="status">Solicitando ubicación...</div>
    </div>

    <!-- Librerías necesarias -->
    <script src="https://cdn.jsdelivr.net/npm/three"></script>
    <script src="https://cdn.jsdelivr.net/npm/globe.gl"></script>
    
    <script>
        // Variables globales
        let globe;
        
        // Inicializar el globo al cargar la página
        window.onload = function() {
            initGlobe();
            obtenerUbicacion();
        };
        
        // Función para inicializar el globo
        function initGlobe() {
            const container = document.getElementById('globeContainer');
            
            // Crear el globo con configuración inicial
            globe = Globe()
                .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
                .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
                .showAtmosphere(true)
                .atmosphereColor('rgba(100, 150, 200, 0.5)')
                .atmosphereAltitude(0.2)
                .width(container.offsetWidth)
                .height(container.offsetHeight)
                (container);
            
            // Ajustar el tamaño cuando la ventana cambie de tamaño
            window.addEventListener('resize', function() {
                globe.width(container.offsetWidth)
                    .height(container.offsetHeight);
            });
        }
        
        // Función para obtener la ubicación del usuario
        function obtenerUbicacion() {
            const statusElement = document.getElementById('status');
            
            if (!navigator.geolocation) {
                statusElement.textContent = 'La geolocalización no es compatible con tu navegador.';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    // Éxito al obtener la ubicación
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    
                    // Añadir marcador en el globo
                    agregarMarcador(lat, lng);
                    
                    // Actualizar mensaje de estado
                    statusElement.textContent = `Ubicación aproximada: Lat ${lat.toFixed(4)}°, Long ${lng.toFixed(4)}°`;
                    
                    // Centrar el globo en la ubicación
                    globe.pointOfView({ lat: lat, lng: lng, altitude: 2.5 }, 1000);
                    
                    // Ocultar el mensaje después de 5 segundos
                    setTimeout(() => {
                        statusElement.style.opacity = '0';
                        setTimeout(() => {
                            statusElement.style.display = 'none';
                        }, 1000);
                    }, 5000);
                },
                function(error) {
                    // Error al obtener la ubicación
                    let errorMessage;
                    switch(error.code) {
                        case error.PERMISSION_DENIED:
                            errorMessage = "Permiso de ubicación denegado. El globo se mostrará sin tu ubicación.";
                            break;
                        case error.POSITION_UNAVAILABLE:
                            errorMessage = "La información de ubicación no está disponible.";
                            break;
                        case error.TIMEOUT:
                            errorMessage = "La solicitud de ubicación ha expirado.";
                            break;
                        default:
                            errorMessage = "Error desconocido al obtener la ubicación.";
                    }
                    statusElement.textContent = errorMessage;
                    
                    // Ocultar el mensaje después de 5 segundos
                    setTimeout(() => {
                        statusElement.style.opacity = '0';
                        setTimeout(() => {
                            statusElement.style.display = 'none';
                        }, 1000);
                    }, 5000);
                },
                {
                    enableHighAccuracy: false,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }
        
        // Función para añadir un marcador de ubicación en el globo
        function agregarMarcador(lat, lng) {
            globe.pointsData([
                {
                    lat: lat,
                    lng: lng,
                    size: 0.5,
                    color: 'red',
                    altitude: 0.1
                }
            ]);
            
            // Configurar el marcador
            globe.pointAltitude('altitude');
            globe.pointRadius('size');
            globe.pointColor('color');
        }
    </script>
</body>
</html>
